name: CampoData Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'campodata/**'
      - 'android/**'
      - '.github/workflows/campodata-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Incorporar questionário e aplicativo offline
        run: |
          mkdir -p android/app/src/main/assets/www
          cp campodata/index.html campodata/style.css campodata/app.js campodata/xlsx.js campodata/questionario.json campodata/manifest.webmanifest campodata/icon.svg android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/questionario.json

      - name: Compilar APK Android
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Disponibilizar APK para instalação
        uses: actions/upload-artifact@v4
        with:
          name: CampoData-Android-APK-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
