plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.campodata.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.campodata.offline'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
